set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# -----------------------------------------------------------------------------
# Status Bar Configuration
# -----------------------------------------------------------------------------

# Enable true color support so hex codes render correctly
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Base status bar styling
# bg=default makes it transparent to blend with the Argonaut background
# fg=#5c5c5c uses a muted grey for inactive elements so they don't demand attention
set-option -g status-style "bg=default,fg=#5c5c5c"

# Completely clear the right side as requested
set-option -g status-right ""

# Minimal left side (just the session name in a slightly brighter grey)
set-option -g status-left "#[fg=#767676] #S  "
# If you want the left side entirely empty as well, uncomment the line below instead:
# set-option -g status-left ""

# Inactive window format (shows Index:WindowName)
set-window-option -g window-status-format " #I:#W "

# Active window format (shows Index:WindowName)
# Uses Argonaut's signature cyan (#00d8eb) to indicate the active window cleanly
set-window-option -g window-status-current-format "#[fg=#00d8eb,bold] #I:#W "

# -----------------------------------------------------------------------------
# Pane Border Configuration (Optional, but helps with the minimalist look)
# -----------------------------------------------------------------------------

# Keep inactive pane borders very dark
set-option -g pane-border-style "fg=#232323"

# Highlight the active pane border with a subtle Argonaut blue
set-option -g pane-active-border-style "fg=#008df8"

